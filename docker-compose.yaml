# Every host-visible and network-visible value is driven by an environment
# variable so the same file can run several independent stacks side by side:
#
#   docker compose up -d                                  # instance 1 (.env)
#   docker compose -p sim2 --env-file .env.sim2 up -d     # instance 2
#
# The defaults below reproduce the original single-instance layout, so a plain
# `docker compose up -d` needs nothing but EXTERNAL_IP. See .env.example for
# what each variable does, and README "Running more than one instance".
#
# Services deliberately have no `container_name:` — that name is a *global*
# Docker namespace and would collide between instances. Compose names them
# `<project>-<service>-1` instead; address them by service name as usual
# (`docker compose logs -f mavrouter`).
#
# Gazebo is the only mode: headless Gazebo Harmonic physics + a forward and a
# down camera (gazebo), proxied by MediaMTX (mediaserver) at /cam1 and /cam2,
# with gzcam1/gzcam2 announcing them to QGroundControl over MAVLink.
#
#   docker compose up -d
services:
  mediaserver:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    networks:
      sim:
        ipv4_address: ${NET_PREFIX:-172.28}.0.11
    environment:
      # Move the in-container listeners to the same numbers as the published
      # host ports. RTSP negotiates the server's RTP/RTCP ports in-band, so
      # remapping only the host side would advertise ports that are not
      # forwarded and RTSP-over-UDP would break on the second instance.
      MTX_RTSPADDRESS: ":${RTSP_PORT:-8554}"
      MTX_RTPADDRESS: ":${RTP_PORT:-8000}"
      MTX_RTCPADDRESS: ":${RTCP_PORT:-8001}"
      # Proxy the RTSP mounts served by the gazebo container (camera_gate.py)
      # as /cam1 and /cam2, pulling only while a client (QGroundControl) is
      # watching -- that pull is what turns the Gazebo camera on. The first
      # DESCRIBE waits for Gazebo's first rendered frame, hence the timeout.
      MTX_PATHS_CAM1_SOURCE: rtsp://${NET_PREFIX:-172.28}.0.30:8554/cam1
      MTX_PATHS_CAM1_SOURCEONDEMAND: "yes"
      MTX_PATHS_CAM1_RTSPTRANSPORT: tcp
      MTX_PATHS_CAM1_SOURCEONDEMANDSTARTTIMEOUT: 30s
      MTX_PATHS_CAM1_SOURCEONDEMANDCLOSEAFTER: 10s
      MTX_PATHS_CAM2_SOURCE: rtsp://${NET_PREFIX:-172.28}.0.30:8554/cam2
      MTX_PATHS_CAM2_SOURCEONDEMAND: "yes"
      MTX_PATHS_CAM2_RTSPTRANSPORT: tcp
      MTX_PATHS_CAM2_SOURCEONDEMANDSTARTTIMEOUT: 30s
      MTX_PATHS_CAM2_SOURCEONDEMANDCLOSEAFTER: 10s
    depends_on:
      - gazebo
    ports:
      - "${RTSP_PORT:-8554}:${RTSP_PORT:-8554}/tcp"
      - "${RTP_PORT:-8000}:${RTP_PORT:-8000}/udp"
      - "${RTCP_PORT:-8001}:${RTCP_PORT:-8001}/udp"

  mavrouter:
    image: mavlink-router:v4
    restart: unless-stopped
    networks:
      sim:
        ipv4_address: ${NET_PREFIX:-172.28}.0.10
    # Config is baked into the image (/etc/mavlink-router/main.conf): one UDP
    # server port per producer -- 24042 autopilot, 24043 GCS, 24044 cam1,
    # 24045 cam2 -- plus TCP 42024. Only the host side of the GCS ports moves.
    ports:
      - "${ROUTER_UDP_PORT:-24043}:24043/udp"
      - "${ROUTER_TCP_PORT:-42024}:42024/tcp"

  autopilot:
    image: ardupilot-sitl:latest
    restart: unless-stopped
    networks:
      sim:
        ipv4_address: ${NET_PREFIX:-172.28}.0.20
    environment:
      # Point SITL at the gazebo service's JSON FDM link (ArduPilot listens
      # on its compiled-in 9003 in / sends to 9002 out, matching GZ_FDM_*
      # below). A non-default NET_PREFIX is followed here, but a
      # GZ_FDM_*_PORT override is NOT picked up (this repo's entrypoint only
      # passes --model through). Use SITL_MODEL=quad for ArduPilot's built-in
      # physics with no Gazebo.
      SITL_MODEL: ${SITL_MODEL:-JSON:${NET_PREFIX:-172.28}.0.30}
      # Literal IPv4, not the "mavrouter" hostname: the sim network is
      # dual-stack and Docker DNS returns the AAAA (IPv6) record first,
      # which ArduPilot's "udpclient:ADDR:PORT" parser cannot handle.
      SITL_ADDR: ${NET_PREFIX:-172.28}.0.10
      SITL_PORT: "24042"
      # Home position "lat,lon,alt,heading". Empty = the home of the site
      # world selected by worldgen (its site_info.json sitl_home), or SITL's
      # own default when no site is configured. It must match the world's
      # origin, or the GPS position and the Gazebo scene disagree.
      SITL_HOME: ${SITL_HOME:-}
      SITE_ACTIVE: /opt/gazebo/sites/.active-${COMPOSE_PROJECT_NAME:-sim1}
    volumes:
      - ./gazebo/sites:/opt/gazebo/sites:ro
    # Wraps the image's /sitl-entrypoint.sh to add --home; `command` holds
    # the image's own default arguments (-w: wipe EEPROM on start), which an
    # entrypoint override would otherwise drop.
    entrypoint:
      - /bin/bash
      - -c
      - |
        home="$${SITL_HOME:-}"
        if [ -z "$$home" ] && [ -f "$$SITE_ACTIVE" ]; then
          home="$$(sed -n 's/^SITL_HOME=//p' "$$SITE_ACTIVE")"
        fi
        if [ -n "$$home" ]; then
          echo "SITL home: $$home"
          exec /sitl-entrypoint.sh "$$@" --home "$$home"
        fi
        exec /sitl-entrypoint.sh "$$@"
      - sitl
    command: ["-w"]
    depends_on:
      mavrouter:
        condition: service_started
      worldgen:
        condition: service_completed_successfully

  # ------------------------------------------------------------ gazebo ---
  # Headless Gazebo Harmonic physics + a forward and a down camera.
  #
  # Video path: GstCameraPlugin -> RTP on 127.0.0.1 inside this container ->
  # camera_gate.py serves it as on-demand RTSP (:8554, /cam1 and /cam2) ->
  # mediaserver (MediaMTX) proxies those as its own /cam1 and /cam2
  # -> QGroundControl. A camera only renders while
  # someone is actually watching (see camera_gate.py's docstring).
  gazebo:
    image: gazebo-sitl:${GZ_TAG:-latest}
    restart: unless-stopped
    networks:
      sim:
        ipv4_address: ${NET_PREFIX:-172.28}.0.30
    environment:
      # ArduPilotPlugin JSON FDM link (ArduPilot's compiled-in defaults,
      # 9003 in / 9002 out). Container-to-container only, not published.
      GZ_FDM_IN_PORT: ${GZ_FDM_IN_PORT:-9002}
      GZ_FDM_OUT_PORT: ${GZ_FDM_OUT_PORT:-9003}
      # Local UDP ports the forward/down GstCameraPlugin sensors send RTP to
      # (on 127.0.0.1 inside this container; camera_gate.py reads them).
      GZ_CAM1_RTP_PORT: ${GZ_CAM1_RTP_PORT:-5600}
      GZ_CAM2_RTP_PORT: ${GZ_CAM2_RTP_PORT:-5601}
      # Render gate: a camera is enabled the moment its RTSP mount gets a
      # client and disabled once it has had none for DISABLE_HOLD seconds.
      GZ_CAMERA_GATE_INTERVAL: ${GZ_CAMERA_GATE_INTERVAL:-2}
      GZ_CAMERA_GATE_DISABLE_HOLD: ${GZ_CAMERA_GATE_DISABLE_HOLD:-10}
      # "<rtsp mount>:<gz enable topic>" pairs; topics match
      # models/iris_dual_cam/model.sdf.template's <enable_topic>.
      GZ_CAMERA_GATE_PATHS: ${GZ_CAMERA_GATE_PATHS:-cam1:/cam1/enable,cam2:/cam2/enable}
      # gz sim console verbosity 0-4; 3+ shows GstCameraPlugin's own lines.
      GZ_VERBOSITY: ${GZ_VERBOSITY:-1}
      # World to load. Empty = the site worldgen selected for SITE_LAT/
      # SITE_LON (read from GZ_SITE_ACTIVE), or the built-in iris_runway when
      # no site is configured. Set it to force a world, e.g.
      # /opt/gazebo/sites/<name>/worlds/<name>.sdf; SITL_HOME must then be
      # that site's origin.
      GZ_WORLD: ${GZ_WORLD:-}
      GZ_SITE_ACTIVE: /opt/gazebo/sites/.active-${COMPOSE_PROJECT_NAME:-sim1}
    volumes:
      - ./gazebo/sites:/opt/gazebo/sites:ro
    depends_on:
      worldgen:
        condition: service_completed_successfully

  # One-shot startup step: generates (or reuses) the georeferenced site world
  # for SITE_LAT/SITE_LON in .env with gazebo/make_gz_world.py -- aerial
  # imagery ground, optional SRTM terrain, OSM / Microsoft buildings, OSM
  # trees -- into ./gazebo/sites/<name>/, then writes the selection file
  # gazebo and autopilot read (world path + SITL home). Generation needs
  # internet access and runs only when the site is missing or its inputs
  # changed; with no location set it just selects the built-in runway.
  # Logs: `docker compose logs worldgen`. See gazebo/sites/README.md.
  worldgen:
    build: ./gazebo/worldgen
    image: gazebo-worldgen:latest
    restart: "no"
    networks:
      - sim
    volumes:
      - ./gazebo/make_gz_world.py:/app/make_gz_world.py:ro
      - ./gazebo/worldgen/prepare_site.py:/app/prepare_site.py:ro
      - ./gazebo/sites:/sites
      # Microsoft building-footprint tiles (~30 MB each), kept between runs.
      - worldgen-cache:/root/.cache
    environment:
      SITE_LAT: ${SITE_LAT:-}
      SITE_LON: ${SITE_LON:-}
      SITE_NAME: ${SITE_NAME:-}
      SITE_RADIUS: ${SITE_RADIUS:-50}
      SITE_TERRAIN: ${SITE_TERRAIN:-1}
      SITE_EXTRA_ARGS: ${SITE_EXTRA_ARGS:-}
      SITE_REGENERATE: ${SITE_REGENERATE:-0}
      SITES_DIR: /sites
      # Per compose project, so two instances can fly different sites.
      ACTIVE_FILE: /sites/.active-${COMPOSE_PROJECT_NAME:-sim1}

  # MAVLink Camera Protocol v2 components (--video-source none: they publish
  # no video, MediaMTX proxies it straight from the gazebo container). They
  # advertise the mediaserver's /cam1 and /cam2 URLs to the GCS and act as
  # full MAVLink cameras: photo/video modes, single and interval photos,
  # video recording, storage info/format, and settings (exposure, white
  # balance, colour, resolution, quality) over PARAM_EXT. Photos/videos are
  # cut from the live stream and stored in ./captures/<cam>/ on the host.
  # Each one runs an HTTP server, published on the host, that serves the
  # camera definition QGC downloads (/camera.xml) and the captured files
  # (the file_url in CAMERA_IMAGE_CAPTURED); both are advertised on
  # EXTERNAL_IP, like the RTSP URLs.
  gzcam1:
    image: tools:latest
    restart: unless-stopped
    volumes:
      - ./tools/demo_video_source.py:/app/demo_video_source.py:ro
      - ./captures/cam1:/data
    ports:
      - "${CAM1_HTTP_PORT:-8091}:${CAM1_HTTP_PORT:-8091}/tcp"
    networks:
      sim:
        ipv4_address: ${NET_PREFIX:-172.28}.0.31
    environment:
      PYTHONUNBUFFERED: "1"
    command:
      - python3
      - demo_video_source.py
      - --host
      - ${NET_PREFIX:-172.28}.0.10
      - --port
      - "24044"
      - --component-id
      - "103"
      - --stream-id
      - "1"
      - --video-source
      - none
      - --rtsp-uri
      - rtsp://${NET_PREFIX:-172.28}.0.11:${RTSP_PORT:-8554}/cam1
      - --notif-uri
      - rtsp://${EXTERNAL_IP:-127.0.0.1}:${RTSP_PORT:-8554}/cam1
      - --camera-vendor
      - FRAVIOFII
      - --camera-model
      - "DF SIM FORWARD"
      - --storage-dir
      - /data
      - --http-port
      - "${CAM1_HTTP_PORT:-8091}"
      - --camera-pitch-deg
      - "0"
    depends_on:
      - mavrouter
      - mediaserver

  gzcam2:
    image: tools:latest
    restart: unless-stopped
    volumes:
      - ./tools/demo_video_source.py:/app/demo_video_source.py:ro
      - ./captures/cam2:/data
    ports:
      - "${CAM2_HTTP_PORT:-8092}:${CAM2_HTTP_PORT:-8092}/tcp"
    networks:
      sim:
        ipv4_address: ${NET_PREFIX:-172.28}.0.32
    environment:
      PYTHONUNBUFFERED: "1"
    command:
      - python3
      - demo_video_source.py
      - --host
      - ${NET_PREFIX:-172.28}.0.10
      - --port
      - "24045"
      - --component-id
      - "104"
      - --stream-id
      - "1"
      - --video-source
      - none
      - --rtsp-uri
      - rtsp://${NET_PREFIX:-172.28}.0.11:${RTSP_PORT:-8554}/cam2
      - --notif-uri
      - rtsp://${EXTERNAL_IP:-127.0.0.1}:${RTSP_PORT:-8554}/cam2
      - --camera-vendor
      - FRAVIOFII
      - --camera-model
      - "DF SIM DOWN"
      - --storage-dir
      - /data
      - --http-port
      - "${CAM2_HTTP_PORT:-8092}"
      - --camera-pitch-deg
      - "-90"
    depends_on:
      - mavrouter
      - mediaserver

networks:
  sim:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        # Static service IPs live in ${NET_PREFIX}.0.0/24; ip_range keeps
        # Docker's dynamic pool clear of them so ad-hoc containers can't grab a
        # reserved address. Each instance needs its own NET_PREFIX and
        # NET6_SUBNET — overlapping pools are rejected by the daemon.
        - subnet: ${NET_PREFIX:-172.28}.0.0/16
          ip_range: ${NET_PREFIX:-172.28}.5.0/24
        - subnet: ${NET6_SUBNET:-fd00:df:5117::/64}

volumes:
  worldgen-cache:
